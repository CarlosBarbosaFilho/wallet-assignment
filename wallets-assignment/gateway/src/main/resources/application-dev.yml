server:
  port: 8086

spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: clients-service
              uri: lb://MS-CLIENTS
              predicates:
                - Path=/api/v1/clients/**
              filters:
                - StripPrefix=0

            - id: wallets-service
              uri: lb://MS-WALLET
              predicates:
                - Path=/api/v1/wallets/**
              filters:
                - StripPrefix=0

            - id: transactions-service
              uri: lb://MS-TRANSACTION
              predicates:
                - Path=/api/v1/transactions/**
              filters:
                - StripPrefix=0

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.loadbalancer: DEBUG
    reactor.netty.http.client: DEBUG
