server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: http://service-discovery:8761/eureka/
spring:
  application:
    name: ms-wallet
  cloud:
    aws:
      region:
        static: us-east-1
      credentials:
        access-key: "cbgomes"
        secret-key: "gbgomes"
      dynamodb:
        endpoint: http://localstack:4566
        #endpoint: http://host.docker.internal:4566
  datasource:
    url: jdbc:postgresql://postgres:5432/ms-wallets
    #url: jdbc:postgresql://host.docker.internal:5432/ms-wallets
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

client:
  url: http://ms-clients:8081/api/v1/clients



