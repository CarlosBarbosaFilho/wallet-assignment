server:
  port: 8083
spring:
  application:
    name: ms-transaction
  cloud:
    aws:
      region:
        static: us-east-1

  datasource:
    url: jdbc:postgresql://postgres:5432/ms-transactions
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

client:
  url: http://ms-wallets:8082/api/v1/wallets
config:
  url-docker-localstack: http://localstack:4566
sns:
  topic-arn-transaction: arn:aws:sns:us-east-1:000000000000:transactions