server:
  port: 8092
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
management:
  endpoint:
    health:
      show-details: always
    prometheus: true
  endpoints:
    web:
      exposure:
        include: health ,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
spring:
  application:
    name: ms-transaction
  cloud:
    aws:
      region:
        static: us-east-1
      kinesis:
        endpoint: http://localhost:4566
        stream-name: event-transactions-wallets
  datasource:
    url: jdbc:postgresql://localhost:5432/ms-transactions
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
    #ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: products-group
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

event:
  topic: events-wallets-transaction

#client:
#  url: http://localhost:8090/api/v1/wallets

config:
  url-docker-localstack: http://localhost:4566

sns:
  topic-arn-transaction: arn:aws:sns:us-east-1:000000000000:transactions

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.loadbalancer: DEBUG
    reactor.netty.http.client: DEBUG